<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background App Icon Shape -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)"/>
  
  <!-- Outer Safety Shield -->
  <path d="M16 6 L24 9.5 V15.5 C24 20.2 20.6 24 16 25.2 C11.4 24 8 20.2 8 15.5 V9.5 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="1.75" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
        
  <!-- Road lines inside shield -->
  <path d="M13.2 21.5 L14.7 13 H17.3 L18.8 21.5" 
        stroke="rgba(255,255,255,0.9)" 
        stroke-width="1.4" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"/>
        
  <!-- Center Dashed Road Divider (Cyan) -->
  <line x1="16" y1="14.5" x2="16" y2="16.5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="18.5" x2="16" y2="20.5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
</svg>
